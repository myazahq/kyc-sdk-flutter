name: myaza_kyc_sdk_flutter
description: Myaza KYC SDK — ID verification, liveness detection, and document OCR for Flutter
version: 2.1.0

homepage: https://github.com/myazahq/kyc-sdk-flutter
repository: https://github.com/myazahq/kyc-sdk-flutter
issue_tracker: https://github.com/myazahq/kyc-sdk-flutter/issues

topics:
  - kyc
  - identity-verification
  - liveness
  - biometrics
  - nfc

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"   # Color.withValues (used throughout) lands in Flutter 3.27 / Dart 3.6

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  dio: ^5.4.0
  camera: ^0.11.0+1
  google_fonts: ^6.2.0
  image: ^4.1.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  uuid: ^4.4.0
  flutter_animate: ^4.5.0
  flutter_tts: ^4.0.2
  image_picker: ^1.1.0
  file_picker: ^8.1.0  # Proof-of-Address step: pick an image OR a PDF document
  flutter_nfc_kit: ^3.6.0  # ISO-DEP transport for the eMRTD chip read
  # eMRTD chip crypto (BAC): 3DES + SHA-1 for key derivation and secure
  # messaging. Standard primitives only — the protocol itself is ours, in
  # lib/src/nfc/.
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  video_compress: ^3.1.3
  flutter_image_compress: ^2.3.0
  lucide_icons_flutter: ^3.1.14+2
  country_flags: ^3.2.0  # 3.x: MyazaCountryFlag uses fromCountryCode(height/width/shape); 4.x replaced these with a FlagTheme API (would need a widget rewrite)
  phone_numbers_parser: ^9.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0

flutter:
  assets:
    - assets/liveness/
  # Native on-device face detection ships in-package: iOS = Apple Vision (Swift),
  # Android = Google ML Kit via native Gradle. No cross-platform GoogleMLKit pod,
  # so the SDK still builds & runs on Apple-Silicon iOS simulators.
  plugin:
    platforms:
      ios:
        pluginClass: KycSdkFlutterPlugin
      android:
        package: co.myazahq.kyc
        pluginClass: KycSdkFlutterPlugin
