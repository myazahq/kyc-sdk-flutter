group 'co.myazahq.kyc'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'co.myazahq.kyc'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        minSdk 21
    }
}

dependencies {
    // Native ML Kit face detection — NOT the cross-platform Flutter package.
    // Keeping ML Kit Android-only (Gradle) means no GoogleMLKit CocoaPod on iOS,
    // so iOS-simulator builds stay green while Android gets real ML Kit liveness.
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // Native ML Kit text recognition — powers MRZ scanning on the NFC step.
    // Android-only for the same reason as face detection: no iOS pod (iOS uses
    // Apple Vision), so simulator builds stay green.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // CameraX — used by the native liveness recorder, which runs a single
    // ImageAnalysis stream and fans each frame to BOTH ML Kit (gesture
    // detection) AND a MediaCodec H.264 encoder. This avoids the 3-use-case
    // (Preview + ImageAnalysis + VideoCapture) limit that starved the gesture
    // stream when the Flutter camera plugin recorded video, so on Android the
    // liveness clip can show the gestures while detection keeps working.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
}
